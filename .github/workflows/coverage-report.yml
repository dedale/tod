name: Code Coverage Report

on:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      
    - name: Build Tod.sln
      run: dotnet build Tod.sln --configuration Release
      
    - name: Run tests with coverage
      run: dotnet test src/Tod.Tests/Tod.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura"
      
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate coverage report
      run: reportgenerator -reports:./**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:"Html;Badges;Cobertura" -classfilters:"-Tod.Program;-Tod.*.Tests.*"
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/report/Cobertura.xml
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Create coverage badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: YOUR_GIST_ID
        filename: tod-coverage.json
        label: Coverage
        message: ${{ env.COVERAGE_PERCENTAGE }}%
        color: ${{ env.COVERAGE_COLOR }}
      env:
        COVERAGE_PERCENTAGE: ${{ steps.coverage.outputs.line-rate }}
        COVERAGE_COLOR: ${{ steps.coverage.outputs.line-rate >= 99 && 'green' || steps.coverage.outputs.line-rate >= 98 && 'yellow' || 'red' }}