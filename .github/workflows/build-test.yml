name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      
    - name: Build Tod.sln
      run: dotnet build Tod.sln --configuration Release
      
    - name: Run tests with coverage
      run: dotnet test src/Tod.Tests/Tod.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
      
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate coverage report
      run: reportgenerator -reports:./**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" -classfilters:"-Tod.Program;-Tod.*.Tests.*"
      
    - name: Write coverage to summary
      if: always()
      shell: pwsh
      run: |
        if (Test-Path "./coverage/report/SummaryGithub.md") {
          Get-Content "./coverage/report/SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY
        }
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/report/Cobertura.xml
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
      
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: github.event_name == 'pull_request'
      with:
        filename: ./coverage/report/Cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: '98 99'
        
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
      
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: './test-results/*.trx'
        reporter: dotnet-trx
        fail-on-error: true
        
    - name: Upload coverage reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./coverage/report/