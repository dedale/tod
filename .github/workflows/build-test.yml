name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      
    - name: Build Tod.sln
      run: dotnet build Tod.sln --configuration Release
      
    - name: Run tests with coverage
      run: dotnet test src/Tod.Tests/Tod.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
      
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
    - name: Generate coverage report
      run: reportgenerator -reports:./**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" -classfilters:"-Tod.Program;-Tod.*.Tests.*"
      
    - name: Write coverage to summary
      if: always()
      shell: pwsh
      run: |
        if (Test-Path "./coverage/report/SummaryGithub.md") {
          Get-Content "./coverage/report/SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY
        }
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/report/Cobertura.xml
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
      
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ./coverage/report/SummaryGithub.md
        
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: './test-results/*.trx'
        reporter: dotnet-trx
        fail-on-error: true
        
    - name: Upload coverage reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: ./coverage/report/
        
    - name: Extract coverage percentage
      id: extract_coverage
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        [xml]$coverage = Get-Content ./coverage/report/Cobertura.xml
        $lineRate = [math]::Round([decimal]$coverage.coverage.'line-rate' * 100, 2)
        echo "percentage=$lineRate" >> $env:GITHUB_OUTPUT
        
        $color = if ($lineRate -ge 99) { "brightgreen" } elseif ($lineRate -ge 98) { "green" } elseif ($lineRate -ge 95) { "yellow" } elseif ($lineRate -ge 90) { "orange" } else { "red" }
        echo "color=$color" >> $env:GITHUB_OUTPUT
        
    - name: Create coverage badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 5c680c43035c20b339344266b4b44755
        filename: tod-coverage.json
        label: Coverage
        message: ${{ steps.extract_coverage.outputs.percentage }}%
        color: ${{ steps.extract_coverage.outputs.color }}