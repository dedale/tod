name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/')
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref }}" -replace 'refs/tags/v', ''
        echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
        
    - name: Set version from input
      if: github.event_name == 'workflow_dispatch'
      id: set_version
      shell: pwsh
      run: |
        echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
        
    - name: Update project version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.VERSION || steps.set_version.outputs.VERSION }}"
        $csprojPath = "src/Tod/Tod.csproj"
        $content = Get-Content $csprojPath -Raw
        $content = $content -replace '<Version>.*?</Version>', "<Version>$version</Version>"
        Set-Content $csprojPath $content
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build Tod.Windows
      run: dotnet build src/Tod.Windows/Tod.Windows.csproj --configuration Release --no-restore
      
    - name: Pack
      run: dotnet pack src/Tod/Tod.csproj --configuration Release --no-build --output ./artifacts
      
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
          user: ${{ secrets.NUGET_USER }}
      
    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg